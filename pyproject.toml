[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sitepulse"
version = "1.0.0"
description = "Website uptime & latency monitor with a live terminal dashboard — zero dependencies"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "YashwanthNomula" }]

[project.scripts]
sitepulse = "sitepulse.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sitepulse*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
